    hardness: hard
    priority: P0
    acceptance: "方案逐项对齐当前原型的文件、画布、侧栏、控制与状态行为，并说明原型与真实实现边界。"
    verification: "检查方案的需求追溯表、原型映射表和实现阶段。"
    owner: "插件研发"
    status: open
    document_refs: []
