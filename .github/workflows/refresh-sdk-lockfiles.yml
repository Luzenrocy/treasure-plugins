name: Refresh SDK dependency lockfiles

on:
  workflow_dispatch:

permissions:
  contents: write
  packages: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      NODE_AUTH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://npm.pkg.github.com

      - name: Resolve the published SDK in every release plugin lockfile
        run: |
          set -euo pipefail
          for plugin in excalidraw google-authenticator guan-xiang-pu json-formatter kao-cheng-ce shi-yu-lu text-diff treasure-plugin; do
            (
              cd "$plugin"
              npm install --package-lock-only --ignore-scripts
            )
          done

      - name: Commit refreshed lockfiles when changed
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- \
            excalidraw/package-lock.json \
            google-authenticator/package-lock.json \
            guan-xiang-pu/package-lock.json \
            json-formatter/package-lock.json \
            kao-cheng-ce/package-lock.json \
            shi-yu-lu/package-lock.json \
            text-diff/package-lock.json \
            treasure-plugin/package-lock.json
          if git diff --cached --quiet; then
            echo 'Lockfiles already resolve the published SDK.'
            exit 0
          fi
          git diff --cached --check
          git commit -m 'chore(deps): lock Treasure SDK 1.0.0'
          git push origin HEAD:main
