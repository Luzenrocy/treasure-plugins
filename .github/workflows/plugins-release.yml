name: Release Plugin

on:
  push:
    tags:
      - 'plugin/**/v*'
  workflow_dispatch:
    inputs:
      plugin:
        description: '插件目录，例如 shi-yu-lu'
        required: true
        type: string
      version:
        description: '发布版本，例如 1.0.1'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Parse release tag
        id: meta
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_PLUGIN: ${{ inputs.plugin }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            plugin="$INPUT_PLUGIN"
            version="$INPUT_VERSION"
          else
            tag="${GITHUB_REF_NAME#plugin/}"
            plugin="${tag%/v*}"
            version="${tag##*/v}"
          fi

          if [ -z "$plugin" ] || [ -z "$version" ]; then
            echo "Invalid plugin release tag: $GITHUB_REF_NAME"
            exit 1
          fi

          if [[ ! "$plugin" =~ ^[a-z][a-z0-9-]*$ ]]; then
            echo "Invalid plugin directory: $plugin"
            exit 1
          fi

          echo "plugin=$plugin" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate plugin metadata
        env:
          PLUGIN: ${{ steps.meta.outputs.plugin }}
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          if [ ! -f "$PLUGIN/package.json" ] || [ ! -f "$PLUGIN/manifest.json" ]; then
            echo "Plugin directory does not exist: $PLUGIN"
            exit 1
          fi

          node <<'NODE'
          const fs = require('fs');
          const path = process.env.PLUGIN;
          const manifest = JSON.parse(fs.readFileSync(`${path}/manifest.json`, 'utf8'));

          if (manifest.publish === false) {
            throw new Error(`${path} is marked publish: false`);
          }
          if (manifest.version !== process.env.RELEASE_VERSION) {
            throw new Error(
              `Version mismatch: manifest=${manifest.version}, tag=${process.env.RELEASE_VERSION}`,
            );
          }
          NODE

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ${{ steps.meta.outputs.plugin }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ steps.meta.outputs.plugin }}
        run: npm ci

      - name: Build release package
        working-directory: ${{ steps.meta.outputs.plugin }}
        run: npm run build:plugin:zip

      - name: Package plugin source
        env:
          PLUGIN: ${{ steps.meta.outputs.plugin }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          source_zip="${PLUGIN}/build-output/${PLUGIN}-source-v${VERSION}.zip"
          git archive \
            --format=zip \
            --output="$source_zip" \
            --prefix="${PLUGIN}-${VERSION}/" \
            "$GITHUB_SHA" \
            "$PLUGIN"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN: ${{ steps.meta.outputs.plugin }}
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          tag="plugin/${PLUGIN}/v${VERSION}"
          gh release create "$tag" \
            "${PLUGIN}/build-output/${PLUGIN}.zip" \
            "${PLUGIN}/build-output/${PLUGIN}-source-v${VERSION}.zip" \
            --title "${PLUGIN} v${VERSION}" \
            --generate-notes \
            --target "$GITHUB_SHA"
