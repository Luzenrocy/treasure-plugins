name: Publish Icons Image

# 子项目 treasure-plugin-icons 的 Docker 镜像仅随正式版本 tag 发布到 GHCR。
# 构建上下文为仓库根（collect 脚本需读取兄弟插件目录）。

on:
  push:
    tags:
      - 'treasure-plugin-icons/v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Compute image name
        id: img
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY,,}/treasure-plugin-icons" >> "$GITHUB_OUTPUT"

      # treasure-plugin-icons/v1.0.0 → ghcr.io/.../treasure-plugin-icons:1.0.0
      # Do not create latest, branch, or commit-SHA tags.
      - name: Compute image tags
        id: tags
        env:
          IMAGE: ${{ steps.img.outputs.image }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          version="${REF_NAME#treasure-plugin-icons/v}"
          test -n "$version"
          echo "tags=${IMAGE}:${version}" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./
          file: ./treasure-plugin-icons/Dockerfile
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
